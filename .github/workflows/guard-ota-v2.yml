name: Guard OTA V2 (block classic)

# Blocks classic / mining-only production artifacts on main (and PRs into main).
# OTA + store builds must always be full V2 UI + games.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: guard-ota-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build production (must be word-forge V2)
        env:
          VITE_ARXON_UI_V2: 'true'
          VITE_WORD_FORGE_ENABLED: 'true'
          # Required after .env was untracked — bake Mining App client keys from Actions secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Missing secret VITE_SUPABASE_URL (Mining App https://….supabase.co)"
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ] && [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing secret VITE_SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_ANON_KEY)"
            exit 1
          fi
          case "${VITE_SUPABASE_URL}" in
            *oztccmrhiawleucdluwb*) ;;
            *)
              echo "::error::VITE_SUPABASE_URL must be Mining App oztccmrhiawleucdluwb (got: ${VITE_SUPABASE_URL})"
              exit 1
              ;;
          esac
          npm ci
          # package.json "build" is locked to --mode word-forge and runs verify:ota-v2.
          npm run build

      - name: Assert package.json build stays word-forge
        run: |
          set -euo pipefail
          node -e "
            const p = require('./package.json');
            const b = p.scripts.build || '';
            if (!b.includes('--mode word-forge')) {
              console.error('FATAL: package.json scripts.build must use --mode word-forge');
              console.error('got:', b);
              process.exit(1);
            }
            if (!b.includes('verify:ota-v2')) {
              console.error('FATAL: package.json scripts.build must run verify:ota-v2');
              console.error('got:', b);
              process.exit(1);
            }
            console.log('OK build script locked:', b);
          "

      - name: Assert env lock files
        run: |
          set -euo pipefail
          grep -q 'VITE_ARXON_UI_V2=true' .env.production
          grep -q 'VITE_WORD_FORGE_ENABLED=true' .env.production
          grep -q 'VITE_ARXON_UI_V2=true' .env.word-forge
          grep -q 'VITE_WORD_FORGE_ENABLED=true' .env.word-forge
          echo 'OK .env.production and .env.word-forge lock V2+games'
