name: Build Android APK

on:
  push:
    branches: [ wallet-on-ota ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build:internal
        env:
          VITE_WORD_FORGE_ENABLED: 'true'
          VITE_ARXON_UI_V2: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Bundle dist into the APK so this sideload does NOT load live pages.dev OTA
      # (OTA still has the Coming Soon wallet). Do not copy this env onto store AAB.
      - name: Sync Capacitor (local bundle)
        run: npx cap sync android
        env:
          CAPACITOR_BUNDLE_LOCAL: 'true'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Set App Icon
        run: |
          cp android/app/src/main/res/icon.png /tmp/icon_source.png
          convert /tmp/icon_source.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon_source.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon_source.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon_source.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon_source.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert /tmp/icon_source.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert /tmp/icon_source.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert /tmp/icon_source.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert /tmp/icon_source.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert /tmp/icon_source.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Add Firebase google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Arxon-Wallet-Private-${{ github.run_number }}.apk

      # Direct .apk download — GitHub Actions zips often fail to extract on phones.
      # Publish before Actions artifacts so a full storage quota cannot skip this step.
      - name: Publish APK on Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: private-wallet-latest
          name: Private wallet APK
          body: |
            Sideload only. Uninstall Play Store Arxon and any older private APK first, then install the `.apk` on this release (not the Actions zip).
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/Arxon-Wallet-Private-${{ github.run_number }}.apk

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Arxon-Wallet-Private-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/Arxon-Wallet-Private-${{ github.run_number }}.apk
          compression-level: 0
