name: Deploy Web (Cloudflare Pages OTA)

# OTA ALWAYS = full V2 UI + games (same as store AAB / build:internal).
# Never deploy classic mining-only to arxon-mobile.pages.dev unless explicitly requested.
# Single production pipeline: this workflow. Git-connected CF builds are disabled/hardened.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Trim whitespace/newlines from pasted secrets (common cause of auth 10000).
          TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ACCOUNT_ID="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Create a token with Account → Cloudflare Pages → Edit and set it in repo secrets."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "Token length: ${#TOKEN} (first4=$(printf '%s' "$TOKEN" | cut -c1-4))"
          echo "Account ID length: ${#ACCOUNT_ID}"

          VERIFY="$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"
          echo "Token verify response: $(printf '%s' "$VERIFY" | head -c 400)"

          if ! printf '%s' "$VERIFY" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::CLOUDFLARE_API_TOKEN failed /user/tokens/verify. Re-create the API token and re-paste into GitHub Secrets with no quotes/spaces/newlines. Do not use a Global API Key."
            exit 1
          fi

          PROJECT="$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/arxon-mobile" || true)"
          echo "Pages project probe (truncated): $(printf '%s' "$PROJECT" | head -c 500)"

          if ! printf '%s' "$PROJECT" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::Token cannot access Pages project arxon-mobile under the given CLOUDFLARE_ACCOUNT_ID (Cloudflare API auth/permission failure, often code 10000)."
            echo "::error::Fix: dash.cloudflare.com/profile/api-tokens → Create Token → template 'Edit Cloudflare Pages' (Account → Cloudflare Pages → Edit). Account Resources must Include the account that owns Workers & Pages → arxon-mobile. Then update GitHub secret CLOUDFLARE_API_TOKEN and re-run."
            echo "::notice::Git-connected Cloudflare Pages can still deploy on push even when this Action fails — check Deployments in the CF Pages project."
            exit 1
          fi

          echo "Cloudflare secrets look valid for Pages project arxon-mobile."
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID"
          } >> "$GITHUB_ENV"

      # Match store AAB/APK/iOS: V2 UI + Word Forge on for Capacitor OTA (pages.dev).
      # Keep write-web-bundle-version so Play WebViews pick up new deploys without a store upload.
      - name: Install and build (full V2 + games)
        env:
          VITE_WORD_FORGE_ENABLED: 'true'
          VITE_ARXON_UI_V2: 'true'
          VITE_GAMES_MAINTENANCE: 'true'
          VITE_APP_MAINTENANCE: 'true'
          # Client keys from GitHub Actions secrets (never commit .env).
          # Use sb_publishable_… — never service_role / sb_secret here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Missing secret VITE_SUPABASE_URL"
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ] && [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing secret VITE_SUPABASE_PUBLISHABLE_KEY (or ANON)"
            exit 1
          fi
          case "${VITE_SUPABASE_URL}" in
            *oztccmrhiawleucdluwb*) ;;
            *)
              echo "::error::VITE_SUPABASE_URL must point at Mining App oztccmrhiawleucdluwb"
              exit 1
              ;;
          esac
          npm ci
          # Disable competing Git-connected Pages builds (classic overwrite race).
          node scripts/lock-cloudflare-pages-ota.mjs || echo "::warning::Could not lock CF Pages Git builds via API — check docs/OTA_V2_LOCK.md"
          # npm run build already ends with verify:ota-v2 (hard fail on classic).
          npm run build
          npm run verify:ota-v2

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler; older action defaults have been flaky on Pages uploads.
          wranglerVersion: '4.28.0'
          command: pages deploy dist --project-name=arxon-mobile --branch=main --commit-dirty=true
          quiet: false

      - name: Verify live OTA is still full V2 + games
        run: |
          set -euo pipefail
          # CDN may lag a few seconds after upload.
          for i in 1 2 3 4 5 6; do
            if npm run verify:ota-v2:live; then
              exit 0
            fi
            echo "Live verify attempt $i failed; waiting..."
            sleep 10
          done
          echo "::error::Live https://arxon-mobile.pages.dev is not full V2+games after deploy."
          echo "::error::Likely a competing Cloudflare Git deploy overwrote the bundle — disable production builds in CF Pages Settings."
          exit 1
