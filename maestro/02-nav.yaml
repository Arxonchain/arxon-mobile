- takeScreenshot: nav-explore
- tapOn:
    point: '50%,94%'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: nav-history
- tapOn:
    point: '70%,94%'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: nav-account
- tapOn:
    point: '90%,94%'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: nav-testnet
- tapOn:
    point: '10%,94%'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: nav-home-return
