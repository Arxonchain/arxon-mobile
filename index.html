    <script>
      // Deep-link bootstrap for auth callbacks.
      // 1) Capacitor HashRouter: path /auth/confirm?... → #/auth/confirm?...
      // 2) If a host ever drops us on /?token_hash=...&type=..., send to /auth/confirm.
      (function () {
        try {
          var path = location.pathname || "/";
          var search = location.search || "";
          var params = new URLSearchParams(search);
          var hasAuthParams =
            params.has("token_hash") ||
            params.has("type") ||
            params.has("code") ||
            params.has("token");

          if (path === "/" && hasAuthParams && (params.get("type") || params.has("token_hash") || params.has("code"))) {
            history.replaceState(null, "", "/auth/confirm" + search);
            path = "/auth/confirm";
          }

          if (
            path.indexOf("/auth/confirm") === 0 ||
            path.indexOf("/reset-password") === 0 ||
            path.indexOf("/change-password") === 0
          ) {
            var isNative =
              !!(window.Capacitor &&
                typeof window.Capacitor.isNativePlatform === "function" &&
                window.Capacitor.isNativePlatform());
            var hash = location.hash || "";
            if (isNative && (!hash || hash === "#" || hash.indexOf("#/") !== 0)) {
              history.replaceState(null, "", "/" + "#" + path + search);
            }
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script>
      (function () {
        var boot = document.getElementById("arxon-boot");
        var errBox = document.getElementById("arxon-boot-error");
        var errMsg = document.getElementById("arxon-boot-error-msg");
        var retryBtn = document.getElementById("arxon-boot-retry");
        var loadingBits = ["arxon-boot-logo", "arxon-boot-spinner", "arxon-boot-title", "arxon-boot-slow"];

        function showBootError(message) {
          if (!boot || !errBox) return;
          loadingBits.forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.style.display = "none";
          });
          var stage = document.getElementById("arxon-boot-stage");
          if (stage) stage.style.display = "none";
          if (errMsg && message) errMsg.textContent = message;
          errBox.style.display = "block";
        }

        var host = location.hostname;
        var path = (location.pathname || "/").replace(/\/$/, "") || "/";
        var isNative =
          !!(window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === "function" &&
            window.Capacitor.isNativePlatform());
        if (isNative) document.documentElement.classList.add("arxon-shell", "arxon-wallet-boot");
        var walletBoot =
          host === "localhost" ||
          host === "127.0.0.1" ||
          isNative ||
          path === "/flow" ||
          path.indexOf("/flow/") === 0;
        if (boot && walletBoot) {
          document.documentElement.classList.add("arxon-wallet-boot");
          document.documentElement.style.background = "#050505";
          document.body.style.background = "#050505";
          if (!window.__ARXON_SPLASH_AT__) window.__ARXON_SPLASH_AT__ = Date.now();
          var stage = document.getElementById("arxon-boot-stage");
          if (stage) {
            var vw = Math.max(window.innerWidth || 390, 1);
            var vh = Math.max(window.innerHeight || 844, 1);
            var cover = Math.max(vw / 390, vh / 844);
            stage.style.transform =
              "translate(" + (vw - 390 * cover) / 2 + "px," + (vh - 844 * cover) / 2 + "px) scale(" + cover + ")";
          }
          try {
            var splash = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
            if (splash && typeof splash.hide === "function") splash.hide();
          } catch (e) {}
        }

        window.__ARXON_DISMISS_BOOT__ = function () {
          if (!boot) return;
          boot.classList.add("hidden");
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        };

        if (document.documentElement.classList.contains("arxon-splash-skip")) {
          window.__ARXON_DISMISS_BOOT__();
        }

        window.__ARXON_MARK_BOOT_FAILED__ = function (reason) {
          showBootError(reason || "The app could not start. Check your connection and try again.");
        };

        if (retryBtn) {
          retryBtn.addEventListener("click", function () {
            location.reload();
          });
        }

        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") {
              showBootError("Could not download the app. Check your network and retry.");
            }
          },
          true
        );
      })();
    </script>
    <script type="module">
      const path = (location.pathname || '/').replace(/\/$/, '') || '/';
      // /flow is the design catalog (laptop preview only). Product wallet is App.
      if (import.meta.env.DEV && (path === '/flow' || path.indexOf('/flow/') === 0)) {
        import('/src/flow-entry.tsx');
      } else {
        import('/src/main.tsx');
      }
    </script>
