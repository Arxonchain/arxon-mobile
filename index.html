    <script>
      // Deep-link bootstrap for auth callbacks.
      // 1) Capacitor HashRouter: path /auth/confirm?... → #/auth/confirm?...
      // 2) If a host ever drops us on /?token_hash=...&type=..., send to /auth/confirm.
      (function () {
        try {
          var path = location.pathname || "/";
          var search = location.search || "";
          var params = new URLSearchParams(search);
          var hasAuthParams =
            params.has("token_hash") ||
            params.has("type") ||
            params.has("code") ||
            params.has("token");

          if (path === "/" && hasAuthParams && (params.get("type") || params.has("token_hash") || params.has("code"))) {
            history.replaceState(null, "", "/auth/confirm" + search);
            path = "/auth/confirm";
          }

          if (
            path.indexOf("/auth/confirm") === 0 ||
            path.indexOf("/reset-password") === 0 ||
            path.indexOf("/change-password") === 0
          ) {
            var isNative =
              !!(window.Capacitor &&
                typeof window.Capacitor.isNativePlatform === "function" &&
                window.Capacitor.isNativePlatform());
            var hash = location.hash || "";
            if (isNative && (!hash || hash === "#" || hash.indexOf("#/") !== 0)) {
              history.replaceState(null, "", "/" + "#" + path + search);
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>

  <body>
    <div id="arxon-boot" role="status" aria-live="polite">
      <img id="arxon-boot-logo" src="/favicon.png" alt="Arxon" width="72" height="72" />
      <div id="arxon-boot-spinner" aria-hidden="true"></div>
      <p id="arxon-boot-title">Loading ARXON…</p>
      <p id="arxon-boot-slow">Still loading — check your connection</p>
      <div id="arxon-boot-error">
        <h2>Can't load Arxon</h2>
        <p id="arxon-boot-error-msg">The app could not start. Check your internet connection and try again.</p>
        <button type="button" id="arxon-boot-retry">Retry</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var boot = document.getElementById("arxon-boot");
        var errBox = document.getElementById("arxon-boot-error");
        var errMsg = document.getElementById("arxon-boot-error-msg");
        var retryBtn = document.getElementById("arxon-boot-retry");
        var loadingBits = ["arxon-boot-logo", "arxon-boot-spinner", "arxon-boot-title", "arxon-boot-slow"];

        function showBootError(message) {
          if (!boot || !errBox) return;
          loadingBits.forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.style.display = "none";
          });
          if (errMsg && message) errMsg.textContent = message;
          errBox.style.display = "block";
        }

        var host = location.hostname;
        var path = (location.pathname || "/").replace(/\/$/, "") || "/";
        var localTest = host === "localhost" || host === "127.0.0.1" || path === "/flow" || path.indexOf("/flow/") === 0;
        if (boot && localTest) {
          var bits = ["arxon-boot-logo", "arxon-boot-spinner", "arxon-boot-title", "arxon-boot-slow"];
          bits.forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.style.display = "none";
          });
          boot.style.background = "#050505";
          boot.style.justifyContent = "center";
          var mark = document.createElement("img");
          mark.alt = "Arxon";
          mark.src = "/wallet-figma/wordmark.png";
          mark.width = 1280;
          mark.height = 500;
          mark.style.width = "236px";
          mark.style.height = "auto";
          mark.style.maxWidth = "none";
          mark.style.objectFit = "contain";
          mark.style.position = "relative";
          boot.appendChild(mark);
        }

        window.__ARXON_DISMISS_BOOT__ = function () {
          if (!boot) return;
          boot.classList.add("hidden");
          window.setTimeout(function () {
            if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
          }, 280);
        };

        window.__ARXON_MARK_BOOT_FAILED__ = function (reason) {
          showBootError(reason || "The app could not start. Check your connection and try again.");
        };

        if (retryBtn) {
          retryBtn.addEventListener("click", function () {
            location.reload();
          });
        }

        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") {
              showBootError("Could not download the app. Check your network and retry.");
            }
          },
          true
        );
      })();
    </script>
    <script type="module">
      const path = (location.pathname || '/').replace(/\/$/, '') || '/';
      if (path === '/flow' || path.indexOf('/flow/') === 0) {
        import('/src/flow-entry.tsx');
      } else {
        import('/src/main.tsx');
      }
    </script>
